name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 209.126.13.233
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /var/www/seatmap
            git pull origin main
            npm install --production
            pm2 restart seatmap
